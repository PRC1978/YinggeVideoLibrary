<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><title>映格 · 管理后台</title>
  <link rel="stylesheet" href="/site.css"><script defer src="/admin/admin.js"></script>
</head>
<body class="admin-body">
  <header class="topbar"><a class="brand" href="/">映格<span>YINGGE</span></a><span class="admin-label">管理后台</span></header>
  <main class="admin-shell">
    <section id="login-view" class="login-view"><p class="edition">OPERATIONS</p><h1>管理入口</h1><p>管理页面需要管理员账号和独立管理密钥。信息仅在当前页面内存中使用，刷新后清除。</p>
      <form id="login-form">
        <label for="username">账号名</label><input id="username" autocomplete="username" required>
        <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required>
        <label for="admin-key">管理密钥</label><input id="admin-key" type="password" autocomplete="off" required placeholder="由服务器管理员单独提供">
        <button class="primary" type="submit">进入后台</button><p id="login-status" class="status" role="status"></p>
      </form>
    </section>
    <section id="password-view" class="login-view" hidden><h1>先修改初始密码</h1><p>管理员初始密码只允许登录一次。新密码至少 16 位，需包含字母和数字；修改后重新登录。</p>
      <form id="password-form"><label for="old-password">初始密码</label><input id="old-password" type="password" autocomplete="current-password" required>
        <label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="16" required>
        <button class="primary" type="submit">修改密码并退出</button><p id="password-status" class="status" role="status"></p></form>
    </section>
    <section id="dashboard-view" hidden>
      <div class="dashboard-head"><div><p class="edition">OPERATIONS</p><h1>服务概况</h1><p>仅显示账号与报告元数据，不展示日志正文。</p></div><button id="logout" class="secondary">退出</button></div>
      <div id="metrics" class="metrics"></div>
      <nav class="tabs" aria-label="后台栏目"><button data-tab="accounts" class="active">账号</button><button data-tab="invites">邀请</button><button data-tab="reports">报告</button><button data-tab="audit">操作记录</button></nav>
      <div class="table-toolbar"><h2 id="section-title">账号</h2><div><button id="new-invite" class="secondary" hidden>生成邀请码</button><button id="refresh" class="secondary">刷新</button></div></div>
      <div id="invite-created" class="invite-created" hidden><strong>新邀请码（仅显示一次）</strong><code id="invite-code"></code><button id="copy-invite" class="secondary">复制</button><p>请通过可信渠道交给受邀者；离开此页后无法再次读取明文。</p></div>
      <div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
      <p id="dashboard-status" class="status" role="status"></p>
    </section>
  </main>
</body>
</html>
