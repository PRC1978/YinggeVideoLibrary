<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" role="img" aria-labelledby="title desc">
  <title id="title">映格视频库的整理流程</title>
  <desc id="desc">视频文件先建立本地索引，再核对多个来源的候选资料，最后通过分类、标签与人物关系浏览。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#eaf0ff"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#afc8ff"/>
      <stop offset="1" stop-color="#718fe4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5e75ad" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="303" rx="22" fill="url(#background)" stroke="#dce5fa"/>
  <text x="40" y="43" fill="#28416f" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700">从视频文件，到可核对的个人资料库</text>
  <text x="40" y="66" fill="#7183a5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12">示意图 · 不含真实视频或用户资料</text>

  <rect x="40" y="91" width="268" height="177" rx="18" fill="#fff" stroke="#dfe7f6" filter="url(#shadow)"/>
  <circle cx="65" cy="117" r="13" fill="#e9efff"/>
  <path d="M58 116h14v9H58zM58 116v-4h5l2 2h7v2" fill="none" stroke="#5575d3" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="88" y="122" fill="#253d6a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700">建立本地索引</text>
  <rect x="56" y="141" width="76" height="91" rx="9" fill="url(#poster)"/>
  <circle cx="94" cy="174" r="15" fill="#ffffff" fill-opacity="0.4"/>
  <path d="M91 166l10 8-10 8z" fill="#fff"/>
  <rect x="143" y="146" width="137" height="9" rx="4.5" fill="#6681bf"/>
  <rect x="143" y="164" width="108" height="7" rx="3.5" fill="#d6e0f4"/>
  <rect x="143" y="183" width="126" height="7" rx="3.5" fill="#d6e0f4"/>
  <rect x="143" y="205" width="44" height="20" rx="10" fill="#ecf3ff"/>
  <text x="165" y="219" fill="#5574b1" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">分类</text>
  <rect x="193" y="205" width="44" height="20" rx="10" fill="#ecf3ff"/>
  <text x="215" y="219" fill="#5574b1" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">标签</text>
  <text x="56" y="253" fill="#8393b2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11">原文件保留在原目录</text>

  <path d="M318 178h26m-8-8 8 8-8 8" fill="none" stroke="#7894d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="354" y="91" width="268" height="177" rx="18" fill="#fff" stroke="#dfe7f6" filter="url(#shadow)"/>
  <circle cx="379" cy="117" r="13" fill="#e9efff"/>
  <path d="M374 117l3 3 7-7" fill="none" stroke="#5575d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="402" y="122" fill="#253d6a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700">搜刮候选与人工审核</text>
  <rect x="370" y="141" width="236" height="42" rx="10" fill="#f2f6ff" stroke="#e2e9f8"/>
  <circle cx="386" cy="162" r="5" fill="#5a83df"/>
  <text x="400" y="166" fill="#354e7c" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11">候选 A · 来源与字段证据</text>
  <rect x="544" y="152" width="49" height="20" rx="10" fill="#dff3e9"/>
  <text x="568" y="166" fill="#25805a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">待核对</text>
  <rect x="370" y="191" width="236" height="42" rx="10" fill="#f8faff" stroke="#e2e9f8"/>
  <circle cx="386" cy="212" r="5" fill="#a3b2d2"/>
  <text x="400" y="216" fill="#536584" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11">候选 B · 保留匹配差异</text>
  <text x="370" y="253" fill="#8393b2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11">低可信度与冲突先交给用户确认</text>

  <path d="M632 178h26m-8-8 8 8-8 8" fill="none" stroke="#7894d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="668" y="91" width="252" height="177" rx="18" fill="#fff" stroke="#dfe7f6" filter="url(#shadow)"/>
  <circle cx="693" cy="117" r="13" fill="#e9efff"/>
  <circle cx="693" cy="117" r="3" fill="#5575d3"/>
  <circle cx="686" cy="111" r="2" fill="#5575d3"/>
  <circle cx="700" cy="111" r="2" fill="#5575d3"/>
  <path d="M693 117l-7-6m7 6 7-6" stroke="#5575d3" stroke-width="1.5"/>
  <text x="716" y="122" fill="#253d6a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700">按关系探索</text>
  <path d="M793 181 725 164M793 181l79-20M793 181l-48 43M793 181l80 43" fill="none" stroke="#bdcae7" stroke-width="2"/>
  <circle cx="793" cy="181" r="29" fill="#6c70c9"/>
  <text x="793" y="185" fill="#fff" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">视频库</text>
  <circle cx="725" cy="164" r="20" fill="#eaf0ff" stroke="#b8cafa"/>
  <text x="725" y="168" fill="#4c69ad" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">分类</text>
  <circle cx="872" cy="161" r="20" fill="#eaf0ff" stroke="#b8cafa"/>
  <text x="872" y="165" fill="#4c69ad" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">标签</text>
  <circle cx="745" cy="224" r="20" fill="#eaf0ff" stroke="#b8cafa"/>
  <text x="745" y="228" fill="#4c69ad" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">人物</text>
  <circle cx="873" cy="224" r="20" fill="#eaf0ff" stroke="#b8cafa"/>
  <text x="873" y="228" fill="#4c69ad" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" text-anchor="middle">推荐</text>
</svg>
